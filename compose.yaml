services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-anchor_portfolio}
      POSTGRES_USER: ${DATABASE_USERNAME:-anchor_portfolio}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-anchor_portfolio_local}

    ports:
      - "5432:5432"

    volumes:
      - anchor-portfolio-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  anchor-portfolio-data:
